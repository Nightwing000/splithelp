services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: splitter_user
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: expense_splitter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d

volumes:
  pgdata: